<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>Gen Z Shop Admin</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
body{background:#f7f6fb;font-family:system-ui,"Noto Sans Bengali",sans-serif;color:#211a31}
.box{background:white;border:1px solid #eee;border-radius:16px;padding:18px}
.field{width:100%;border:1px solid #ddd6e9;border-radius:10px;padding:10px;margin:5px 0 12px}
.btn{border-radius:10px;padding:10px 14px;font-weight:700}
.primary{background:#6d28d9;color:white}
</style>
</head>

<body>

<header class="bg-purple-800 text-white p-4">
<div class="max-w-6xl mx-auto flex justify-between">
<a href="index.html" class="font-black text-xl">Gen Z Shop · Admin</a>
<button id="logout">লগআউট</button>
</div>
</header>

<main class="max-w-6xl mx-auto p-3 md:p-6">

<div id="loginBox" class="box max-w-md mx-auto mt-8">
<h1 class="font-black text-2xl">অ্যাডমিন লগইন</h1>

<form id="loginForm">
<label>ইমেইল</label>
<input id="email" class="field" type="email" required>

<label>পাসওয়ার্ড</label>
<input id="password" class="field" type="password" required>

<button class="btn primary w-full">লগইন</button>
</form>

<p id="loginMsg" class="text-sm mt-3"></p>
</div>

<div id="dashboard" class="hidden">

<div class="flex justify-between items-center mb-5">
<h1 class="text-2xl font-black">অ্যাডমিন ড্যাশবোর্ড</h1>
<a href="index.html" class="btn bg-white">শপ দেখুন ↗</a>
</div>

<div class="grid md:grid-cols-2 gap-4">

<section class="box">
<h2 class="font-black text-xl mb-3" id="formTitle">নতুন পণ্য যোগ করুন</h2>

<form id="productForm">
<input type="hidden" id="pid">

<label>পণ্যের নাম</label>
<input id="pname" class="field" required maxlength="160">

<label>ক্যাটাগরি</label>
<input id="pcat" class="field" required>

<label>মূল দাম</label>
<input id="pprice" class="field" type="number" min="0" step="0.01" required>

<p class="text-xs text-purple-700">বিক্রয় মূল্য = মূল দাম + ৳৫</p>

<label>ছবির URL</label>
<input id="pimage" class="field" type="url">

<label>বিবরণ</label>
<textarea id="pdesc" class="field"></textarea>

<div class="flex gap-2">
<button class="btn primary flex-1">সংরক্ষণ</button>
<button type="button" id="reset" class="btn bg-gray-100">মুছুন</button>
</div>
</form>

<p id="productMsg" class="text-sm mt-3"></p>
</section>

<section class="box">
<h2 class="font-black text-xl mb-3">পণ্যের তালিকা</h2>
<div id="productList" class="space-y-2 text-sm"></div>
</section>

</div>

<!-- Orders -->
<section class="box mt-4">
<h2 class="font-black text-xl mb-3">অর্ডার ম্যানেজমেন্ট</h2>
<div id="orders" class="overflow-x-auto text-sm">লোড হচ্ছে…</div>
</section>

<!-- Coupon Report -->
<section class="box mt-4">
<h2 class="font-black text-xl mb-3">🎟️ কুপন ব্যবহারের রিপোর্ট</h2>

<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">

<div class="bg-purple-50 rounded-xl p-3">
<p class="text-sm">মোট ব্যবহার</p>
<b id="couponCount" class="text-2xl">০</b>
</div>

<div class="bg-green-50 rounded-xl p-3">
<p class="text-sm">মোট ছাড়</p>
<b id="couponDiscount" class="text-2xl">৳০</b>
</div>

<div class="bg-orange-50 rounded-xl p-3">
<p class="text-sm">NIROB 00 ব্যবহার</p>
<b id="freeCouponCount" class="text-2xl">০</b>
</div>

</div>

<div id="couponReport" class="overflow-x-auto text-sm">
লোড হচ্ছে…
</div>
</section>

</div>
</main>

<script>
const cfg=window.GENZ_CONFIG||{};
const $=id=>document.getElementById(id);

let db=null;
let items=[];

const money=n=>'৳'+Number(n||0).toLocaleString('en-US');

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function reset(){
$('pid').value='';
$('productForm').reset();
$('formTitle').textContent='নতুন পণ্য যোগ করুন';
}

$('reset').onclick=reset;

async function check(){

if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){
$('loginMsg').textContent='config.js পরীক্ষা করুন।';
return;
}

db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);

let {data:{session}}=await db.auth.getSession();

if(session)await verify();
}

async function verify(){

let {data:{user}}=await db.auth.getUser();

if(!user){
showLogin();
return;
}

let {data,error}=await db.from('admins')
.select('user_id')
.eq('user_id',user.id)
.maybeSingle();

if(error||!data){
$('loginMsg').textContent='এই অ্যাকাউন্ট অ্যাডমিন নয়।';
await db.auth.signOut();
showLogin();
return;
}

$('loginBox').classList.add('hidden');
$('dashboard').classList.remove('hidden');

loadProducts();
loadOrders();
loadCoupons();
}

function showLogin(){
$('loginBox').classList.remove('hidden');
$('dashboard').classList.add('hidden');
}

$('loginForm').onsubmit=async e=>{
e.preventDefault();

let {error}=await db.auth.signInWithPassword({
email:$('email').value,
password:$('password').value
});

if(error){
$('loginMsg').textContent=error.message;
return;
}

await verify();
};

$('logout').onclick=async()=>{
if(db)await db.auth.signOut();
showLogin();
};

async function loadProducts(){

let {data,error}=await db.from('products')
.select('*')
.order('created_at',{ascending:false});

if(error){
$('productList').textContent=error.message;
return;
}

items=data||[];

$('productList').innerHTML=items.map(p=>`
<div class="border rounded-xl p-3 flex justify-between gap-2">
<div>
<b>${esc(p.name)}</b>
<div class="text-gray-500">
${esc(p.category)}
· মূল ${money(p.base_price)}
· বিক্রয় ${money(Number(p.base_price)+5)}
· ${p.active?'সক্রিয়':'লুকানো'}
</div>
</div>

<div class="flex gap-2">
<button class="text-purple-700 font-bold" onclick="editP('${p.id}')">এডিট</button>
<button class="text-red-600 font-bold" onclick="delP('${p.id}')">ডিলিট</button>
</div>
</div>
`).join('')||'কোনো পণ্য নেই।';
}

window.editP=id=>{
let p=items.find(x=>x.id===id);
if(!p)return;

$('pid').value=p.id;
$('pname').value=p.name;
$('pcat').value=p.category;
$('pprice').value=p.base_price;
$('pimage').value=p.image_url||'';
$('pdesc').value=p.description||'';

$('formTitle').textContent='পণ্য এডিট করুন';
window.scrollTo({top:0,behavior:'smooth'});
};

window.delP=async id=>{
if(!confirm('পণ্য ডিলিট করবেন?'))return;

let {error}=await db.from('products').delete().eq('id',id);

if(error)alert(error.message);
else loadProducts();
};

$('productForm').onsubmit=async e=>{
e.preventDefault();

let id=$('pid').value;

let p={
name:$('pname').value.trim(),
category:$('pcat').value.trim(),
base_price:Number($('pprice').value),
image_url:$('pimage').value.trim()||null,
description:$('pdesc').value.trim()||null,
active:true
};

let r=id
?await db.from('products').update(p).eq('id',id)
:await db.from('products').insert(p);

$('productMsg').textContent=r.error?r.error.message:'সফলভাবে সংরক্ষণ হয়েছে।';

if(!r.error){
reset();
loadProducts();
}
};

async function loadOrders(){

let {data,error}=await db.from('orders')
.select('id,customer_name,phone,address,total,status,created_at,coupon_code,subtotal,discount')
.order('created_at',{ascending:false})
.limit(100);

if(error){
$('orders').textContent=error.message;
return;
}

let statuses=['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'];

$('orders').innerHTML=data?.length?`
<table class="w-full min-w-[850px]">
<thead>
<tr class="text-left border-b">
<th class="p-2">অর্ডার</th>
<th>গ্রাহক</th>
<th>ঠিকানা</th>
<th>সাবটোটাল</th>
<th>কুপন</th>
<th>ছাড়</th>
<th>মোট</th>
<th>স্ট্যাটাস</th>
</tr>
</thead>

<tbody>
${data.map(o=>`
<tr class="border-b">
<td class="p-2">
${o.id.slice(0,8)}
<div class="text-gray-500">${new Date(o.created_at).toLocaleString('bn-BD')}</div>
</td>

<td>${esc(o.customer_name)}<div>${esc(o.phone)}</div></td>
<td>${esc(o.address)}</td>
<td>${money(o.subtotal??o.total)}</td>
<td>${esc(o.coupon_code||'—')}</td>
<td>${money(o.discount)}</td>
<td>${money(o.total)}</td>

<td>
<select class="border rounded p-1"
onchange="statusOrder('${o.id}',this.value)">
${statuses.map(s=>`
<option ${s===o.status?'selected':''}>${s}</option>
`).join('')}
</select>
</td>
</tr>
`).join('')}
</tbody>
</table>
`:'এখনো কোনো অর্ডার নেই।';
}

window.statusOrder=async(id,status)=>{
let {error}=await db.from('orders').update({status}).eq('id',id);

if(error)alert(error.message);
else loadOrders();
};

async function loadCoupons(){

let {data,error}=await db.from('coupon_redemptions')
.select('*')
.order('created_at',{ascending:false});

if(error){
$('couponReport').textContent=error.message;
return;
}

data=data||[];

$('couponCount').textContent=data.length;
$('couponDiscount').textContent=money(data.reduce((s,x)=>s+Number(x.discount),0));
$('freeCouponCount').textContent=data.filter(x=>x.coupon_code==='NIROB 00').length;

$('couponReport').innerHTML=data.length?`
<table class="w-full min-w-[600px]">
<thead>
<tr class="text-left border-b">
<th class="p-2">কুপন</th>
<th>ব্যবহারকারী ID</th>
<th>অর্ডার ID</th>
<th>ছাড়</th>
<th>তারিখ</th>
</tr>
</thead>

<tbody>
${data.map(x=>`
<tr class="border-b">
<td class="p-2 font-bold">${esc(x.coupon_code)}</td>
<td>${esc(x.user_id)}</td>
<td>${esc(x.order_id||'—')}</td>
<td>${money(x.discount)}</td>
<td>${new Date(x.created_at).toLocaleString('bn-BD')}</td>
</tr>
`).join('')}
</tbody>
</table>
`:'এখনো কোনো কুপন ব্যবহার হয়নি।';
}

check();
</script>

</body>
</html>
